<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Contact</title>
    <link rel="stylesheet" href="/styles.css">
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            max-width: 500px;
            background: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            box-sizing: border-box;
        }

        .header {
            margin-bottom: 30px;
            text-align: center;
        }

        .header h2 {
            font-size: 28px;
            color: #bb86fc;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .header p {
            color: #bdbdbd;
            font-size: 16px;
        }

        .edit-form label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
            color: #e0e0e0;
        }

        .edit-form input[type="text"],
        .edit-form input[type="email"],
        .edit-form input[type="tel"] {
            width: calc(100% - 22px);
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #333;
            border-radius: 5px;
            font-size: 16px;
            background-color: #2c2c2c;
            color: #ffffff;
        }

        .edit-form input::placeholder {
            color: #bdbdbd;
        }

        .edit-form button {
            width: 100%;
            padding: 12px;
            border-radius: 4px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .edit-form button[type="submit"] {
            background-color: #bb86fc;
            color: white;
            border: none;
        }

        .edit-form button[type="submit"]:hover {
            background-color: #9a67ea;
        }

        .edit-form button[type="button"] {
            background-color: transparent;
            color: #bb86fc;
            border: 1px solid #bb86fc;
            margin-top: 10px;
        }

        .edit-form button[type="button"]:hover {
            background-color: #333;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="edit-form">
        <div class="header">
            <h2>Edit Contact</h2>
            <p>Enter correct details to edit this contact</p>
        </div>

        <th:block th:if="${contact.resourceName}">
            <form id="editForm" th:action="@{/contacts/edit}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <input type="hidden" name="id" th:value="${#uris.escapePath(contact.resourceName)}" />
                <input type="hidden" name="etag" th:value="${contact.etag}" />

                <label for="name">Name:</label>
                <input type="text" id="name" name="name" th:value="${contact.name}" required
                       th:attr="data-original=${contact.name}">

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" th:value="${contact.email ?: 'No Email'}"
                       th:attr="data-original=${contact.email}">

                <label for="phoneNumber">Phone Number:</label>
                <input type="tel" id="phoneNumber" name="phoneNumber" th:value="${contact.phoneNumber}" required
                       th:attr="data-original=${contact.phoneNumber}">

                <button type="submit" onclick="return confirm('Save changes?')">Update Contact</button>
                <button type="button" onclick="resetFormAndGoBack()">Back</button>
            </form>
        </th:block>
    </div>
</div>

<script>
    function resetFormAndGoBack() {
        let inputs = document.querySelectorAll("#editForm input[type='text'], #editForm input[type='email'], #editForm input[type='tel']");
        inputs.forEach(input => {
            input.value = input.getAttribute("data-original"); // Reset to original value
        });

        window.location.href = "/contacts"; // Go back
    }
</script>

</body>
</html>
